[project]
name = "droidscope"
version = "0.1.0"
description = "DroidScope - Android application security analysis framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "greenlet>=3.1",
  "python-multipart>=0.0.17",
  "androguard>=4.1.2",
  "pyelftools>=0.31",
  "cryptography>=43.0",
  "asn1crypto>=1.5",
  "reportlab>=4.2",
  "jinja2>=3.1",
  "httpx>=0.27",
  "typer>=0.15",
  "rich>=13.9",
  "structlog>=24.4",
  "psutil>=6.1",
  "defusedxml>=0.7.1",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.2"]
yara = ["yara-python>=4.5"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
droidscope = "app.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S"]
ignore = ["S101", "B008", "S603", "S607", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
# The report template embeds CSS and HTML, where wrapping at 100 columns makes
# the markup harder to read than leaving the lines intact.
"app/reports/html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
