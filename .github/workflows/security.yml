name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed advisory in a pinned dependency is noticed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      - name: Install backend and audit tooling
        working-directory: backend
        run: |
          # See backend.yml: the system Python is externally managed.
          uv venv .venv
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "${GITHUB_PATH}"
          uv pip install --python .venv/bin/python -e ".[dev,yara]"
          uv pip install --python .venv/bin/python pip-audit

      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --strict --progress-spinner off || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

  secrets:
    name: Committed secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  self_scan:
    name: DroidScope scans its own fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Install dependencies
        working-directory: backend
        run: |
          # Ubuntu's system Python is externally managed (PEP 668), so uv
          # cannot install into it. A venv on PATH mirrors local development
          # and keeps the console scripts available to later steps.
          uv venv .venv
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "${GITHUB_PATH}"
          uv pip install --python .venv/bin/python -e ".[dev,yara]"
      - name: Install JADX
        # Without it the self-scan only exercises manifest rules, which would
        # make this job a much weaker regression check.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre-headless unzip
          JADX_VERSION=1.5.1
          curl -fsSL -o /tmp/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          sudo mkdir -p /opt/jadx && sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          sudo chmod +x /opt/jadx/bin/jadx

      - name: Build the vulnerable fixture
        run: scripts/development/build_fixture_apk.sh vulnerable
      - name: Analyse it and emit SARIF
        env:
          DROIDSCOPE_DATA_DIR: ${{ runner.temp }}/droidscope-data
        run: |
          droidscope analyze tests/fixtures/vulnerable-app.apk \
            --profile standard --json > "${{ runner.temp }}/result.json" || true
          python - <<'PY'
          import json

          with open("${{ runner.temp }}/result.json") as handle:
              result = json.load(handle)

          counts = result["severity_counts"]
          incomplete = [a for a in result["analyzers"] if a["status"] != "completed"]
          print("findings:", result["findings_total"], counts)
          for item in incomplete:
              print(f"  analyzer {item['analyzer']} did not run: {item['error']}")

          # The fixture is deliberately insecure, so a scan that finds little
          # means the detection engine regressed. The thresholds are stated
          # against what actually ran, so a missing tool reports as a missing
          # tool rather than as a detection regression.
          assert not incomplete, f"analyzers did not run: {[i['analyzer'] for i in incomplete]}"
          assert result["findings_total"] > 40, "detection regression: too few findings"
          assert counts.get("critical", 0) >= 5, "detection regression: critical findings missing"
          assert counts.get("high", 0) >= 10, "detection regression: high findings missing"
          print("detection engine healthy")
          PY
