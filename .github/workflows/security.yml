name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed advisory in a pinned dependency is noticed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      - name: Install backend and audit tooling
        working-directory: backend
        run: |
          uv pip install --system -e ".[dev,yara]"
          uv pip install --system pip-audit

      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --strict --progress-spinner off || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

  secrets:
    name: Committed secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  self_scan:
    name: DroidScope scans its own fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - working-directory: backend
        run: uv pip install --system -e ".[dev,yara]"
      - name: Build the vulnerable fixture
        run: scripts/development/build_fixture_apk.sh vulnerable
      - name: Analyse it and emit SARIF
        env:
          DROIDSCOPE_DATA_DIR: ${{ runner.temp }}/droidscope-data
        run: |
          droidscope analyze tests/fixtures/vulnerable-app.apk \
            --profile standard --json > "${{ runner.temp }}/result.json" || true
          python -c "
          import json, sys
          with open('${{ runner.temp }}/result.json') as handle:
              result = json.load(handle)
          counts = result['severity_counts']
          print('findings:', result['findings_total'], counts)
          # The fixture is deliberately insecure; a scan that finds nothing
          # means the detection engine regressed.
          assert result['findings_total'] > 20, 'detection regression: too few findings'
          assert counts.get('critical', 0) > 0, 'detection regression: no critical findings'
          "
