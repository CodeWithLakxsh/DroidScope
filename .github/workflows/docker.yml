name: Docker

on:
  push:
    branches: [main]
    paths: ['docker/**', 'docker-compose.yml', 'backend/**', 'frontend/**']
  pull_request:
    paths: ['docker/**', 'docker-compose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: true
          tags: droidscope-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          load: true
          tags: droidscope-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the CLI runs inside the image
        run: |
          docker run --rm droidscope-backend:ci droidscope version
          docker run --rm droidscope-backend:ci droidscope rules validate
